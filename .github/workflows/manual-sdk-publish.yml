name: Manual SDK Publish (Crates.io)

on:
  workflow_dispatch:
    inputs:
      cargo_registry_token:
        description: "Crates.io API token (from https://crates.io/settings/tokens)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CARGO_REGISTRY_TOKEN: ${{ inputs.cargo_registry_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Safety gate — validate token
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "Publish blocked: CARGO_REGISTRY_TOKEN is empty."
            exit 1
          fi
      - name: Validate workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets
          cargo build --workspace --all-targets
      - name: Publish all crates to crates.io
        run: bash .github/skills/sdk-parent/scripts/publish_all_sdks.sh

      - name: Capture version
        id: version
        run: |
          VERSION=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["package"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Tapis Rust SDK v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Published crates
            - [tapis-core](https://crates.io/crates/tapis-core)
            - [tapis-actors](https://crates.io/crates/tapis-actors)
            - [tapis-apps](https://crates.io/crates/tapis-apps)
            - [tapis-authenticator](https://crates.io/crates/tapis-authenticator)
            - [tapis-files](https://crates.io/crates/tapis-files)
            - [tapis-globus-proxy](https://crates.io/crates/tapis-globus-proxy)
            - [tapis-jobs](https://crates.io/crates/tapis-jobs)
            - [tapis-meta](https://crates.io/crates/tapis-meta)
            - [tapis-notifications](https://crates.io/crates/tapis-notifications)
            - [tapis-pgrest](https://crates.io/crates/tapis-pgrest)
            - [tapis-pods](https://crates.io/crates/tapis-pods)
            - [tapis-sk](https://crates.io/crates/tapis-sk)
            - [tapis-streams](https://crates.io/crates/tapis-streams)
            - [tapis-systems](https://crates.io/crates/tapis-systems)
            - [tapis-tenants](https://crates.io/crates/tapis-tenants)
            - [tapis-tokens](https://crates.io/crates/tapis-tokens)
            - [tapis-workflows](https://crates.io/crates/tapis-workflows)
